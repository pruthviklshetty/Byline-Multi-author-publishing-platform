{% extends "layout.html" %}
{% block content %}
    <div class="wrap wrap--form">
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-sub">Sign in to write and manage your articles.</p>
        <form id="loginForm" class="form" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email"
                       id="email"
                       name="username"
                       autocomplete="email"
                       placeholder="you@example.com"
                       required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn--primary btn--block">Sign in</button>
            </div>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('forgot_password_page') }}">Forgot your password?</a>
            <p>
                New here? <a href="{{ url_for('register_page') }}">Create an account</a>
            </p>
        </div>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">
import { getErrorMessage, showModal } from '/static/js/utils.js';

const loginForm = document.getElementById('loginForm');

loginForm.addEventListener('submit', async (event) => {

    event.preventDefault();

    const formData = new FormData(loginForm);

    try {

        // OAuth2PasswordRequestForm expects form data
        const response = await fetch('/api/users/token', {
            method: 'POST',
            body: formData,
        });

        if (response.ok) {

            const data = await response.json();

            // Store JWT token
            localStorage.setItem('access_token', data.access_token);

            document.getElementById('successMessage').textContent =
                'Signed in. Redirecting…';

            showModal('successModal');

            document
                .getElementById('successModal')
                .addEventListener('hidden.bs.modal', () => {
                    window.location.href = '/';
                }, { once: true });

        } else {

            const error = await response.json();

            document.getElementById('errorMessage').textContent =
                getErrorMessage(error);

            showModal('errorModal');

        }

    } catch (error) {

        document.getElementById('errorMessage').textContent =
            'Unable to connect to the server. Please check your internet connection and try again.';

        showModal('errorModal');

    }

});
    </script>
{% endblock scripts %}

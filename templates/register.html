{% extends "layout.html" %}
{% block content %}
    <div class="wrap wrap--form">
        <h1 class="auth-title">Create an account</h1>
        <p class="auth-sub">Publish articles, manage your profile, and read everything else.</p>
        <form id="registerForm" class="form" novalidate>
            <div class="field">
                <label for="username">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       autocomplete="username"
                       required
                       minlength="1"
                       maxlength="50">
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email"
                       id="email"
                       name="email"
                       autocomplete="email"
                       required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="new-password"
                       required
                       minlength="8">
                <p class="field-hint">Use at least 8 characters.</p>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       autocomplete="new-password"
                       required
                       minlength="8">
                <p id="passwordError" class="field-error d-none">Passwords do not match.</p>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn--primary btn--block">Create account</button>
            </div>
        </form>
        <div class="auth-links">
            <p>
                Already have an account? <a href="{{ url_for('login_page') }}">Sign in</a>
            </p>
        </div>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">

import { getErrorMessage, showModal } from '/static/js/utils.js';

const registerForm = document.getElementById('registerForm');
const passwordInput = document.getElementById('password');
const confirmPasswordInput = document.getElementById('confirmPassword');
const passwordError = document.getElementById('passwordError');

// Live password validation
confirmPasswordInput.addEventListener('input', () => {

    if (passwordInput.value !== confirmPasswordInput.value) {

        passwordError.classList.remove('d-none');
        confirmPasswordInput.setCustomValidity('Passwords do not match');

    } else {

        passwordError.classList.add('d-none');
        confirmPasswordInput.setCustomValidity('');

    }

});

registerForm.addEventListener('submit', async (event) => {

    event.preventDefault();

    if (passwordInput.value !== confirmPasswordInput.value) {
        passwordError.classList.remove('d-none');
        return;
    }

    const formData = new FormData(registerForm);

    const userData = {
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password'),
    };

    try {

        const response = await fetch('/api/users', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json',
            },

            body: JSON.stringify(userData),

        });

        if (response.ok) {

            document.getElementById('successMessage').textContent =
                'Your account is ready. You can sign in now.';

            showModal('successModal');

            document
                .getElementById('successModal')
                .addEventListener('hidden.bs.modal', () => {

                    window.location.href = '/login';

                }, { once: true });

        } else {

            const error = await response.json();

            document.getElementById('errorMessage').textContent =
                getErrorMessage(error);

            showModal('errorModal');

        }

    } catch (error) {

        document.getElementById('errorMessage').textContent =
            'Unable to connect to the server. Please check your internet connection and try again.';

        showModal('errorModal');

    }

});

    </script>
{% endblock scripts %}

{% extends "layout.html" %}
{% block content %}
    <div class="wrap wrap--form">
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-sub">
            Enter your account email. If it exists, we’ll send a link to set a new password.
        </p>
        <form id="forgotPasswordForm" class="form" novalidate>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email"
                       id="email"
                       name="email"
                       autocomplete="email"
                       placeholder="you@example.com"
                       required
                       autofocus>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn--primary btn--block" id="submitBtn">Send reset link</button>
            </div>
        </form>
        <div class="auth-links">
            <p>
                Remembered it? <a href="{{ url_for('login_page') }}">Sign in</a>
            </p>
        </div>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">

import { getErrorMessage, showModal } from '/static/js/utils.js';

const forgotPasswordForm = document.getElementById('forgotPasswordForm');
const submitBtn = document.getElementById('submitBtn');

forgotPasswordForm.addEventListener('submit', async (event) => {

    event.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const formData = new FormData(forgotPasswordForm);
    const data = Object.fromEntries(formData.entries());

    try {

        const response = await fetch('/api/users/forgot-password', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json',
            },

            body: JSON.stringify(data),

        });

        if (response.status === 202) {

            document.getElementById('successMessage').textContent =
                'If an account matches that email, reset instructions are on the way.';

            showModal('successModal');

            forgotPasswordForm.reset();

        } else {

            const error = await response.json();

            document.getElementById('errorMessage').textContent =
                getErrorMessage(error);

            showModal('errorModal');

        }

    } catch (error) {

        document.getElementById('errorMessage').textContent =
            'Unable to connect to the server. Please check your internet connection and try again.';

        showModal('errorModal');

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset link';

    }

});

    </script>
{% endblock scripts %}

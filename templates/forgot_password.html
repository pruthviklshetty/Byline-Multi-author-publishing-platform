{% extends "layout.html" %}

{% block content %}
<div class="content-section py-3 px-4 mb-4">

    <h2 class="mb-3">Forgot Your Password?</h2>

    <p class="text-body-secondary mb-4">
        Enter the email address associated with your account. If an account exists, we'll send you instructions to reset your password.
    </p>

    <form id="forgotPasswordForm">

        <div class="mb-3">

            <label for="email" class="form-label">
                Email Address
            </label>

            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
                autofocus>

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100"
            id="submitBtn">

            Send Password Reset Link

        </button>

    </form>

    <hr class="my-4">

    <p class="text-center mb-0">

        Remember your password?

        <a href="{{ url_for('login_page') }}">
            Sign in
        </a>

    </p>

</div>
{% endblock content %}

{% block scripts %}
<script type="module">

import { getErrorMessage, showModal } from '/static/js/utils.js';

const forgotPasswordForm = document.getElementById('forgotPasswordForm');
const submitBtn = document.getElementById('submitBtn');

forgotPasswordForm.addEventListener('submit', async (event) => {

    event.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending Email...';

    const formData = new FormData(forgotPasswordForm);
    const data = Object.fromEntries(formData.entries());

    try {

        const response = await fetch('/api/users/forgot-password', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json',
            },

            body: JSON.stringify(data),

        });

        if (response.status === 202) {

            document.getElementById('successMessage').textContent =
                'If an account is associated with this email address, password reset instructions will be sent shortly.';

            showModal('successModal');

            forgotPasswordForm.reset();

        } else {

            const error = await response.json();

            document.getElementById('errorMessage').textContent =
                getErrorMessage(error);

            showModal('errorModal');

        }

    } catch (error) {

        document.getElementById('errorMessage').textContent =
            'Unable to connect to the server. Please check your internet connection and try again.';

        showModal('errorModal');

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Password Reset Link';

    }

});

</script>
{% endblock scripts %}

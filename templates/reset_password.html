{% extends "layout.html" %}
{% block content %}
    <div class="wrap wrap--form">
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-sub">Pick a strong password. You’ll sign in with it right after.</p>
        <form id="resetPasswordForm" class="form" novalidate>
            <div class="field">
                <label for="newPassword">New password</label>
                <input type="password"
                       id="newPassword"
                       name="new_password"
                       autocomplete="new-password"
                       required
                       minlength="8"
                       autofocus>
                <p class="field-hint">Use at least 8 characters.</p>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password"
                       id="confirmPassword"
                       name="confirm_password"
                       autocomplete="new-password"
                       required
                       minlength="8">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn--primary btn--block" id="submitBtn">Reset password</button>
            </div>
        </form>
        <div class="auth-links">
            <p>
                Remembered it? <a href="{{ url_for('login_page') }}">Sign in</a>
            </p>
        </div>
    </div>
{% endblock content %}
{% block scripts %}
    <script type="module">

import { getErrorMessage, showModal } from '/static/js/utils.js';

// Extract token from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

// Validate token
if (!token) {
    document.getElementById('errorMessage').textContent =
        'This password reset link is invalid or has expired. Please request a new password reset email.';
    showModal('errorModal');
    document.getElementById('submitBtn').disabled = true;
}

const resetPasswordForm = document.getElementById('resetPasswordForm');
const submitBtn = document.getElementById('submitBtn');

resetPasswordForm.addEventListener('submit', async (event) => {

    event.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Password confirmation check
    if (newPassword !== confirmPassword) {

        document.getElementById('errorMessage').textContent =
            'The passwords you entered do not match. Please try again.';

        showModal('errorModal');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating…';

    try {

        const response = await fetch('/api/users/reset-password', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json',
            },

            body: JSON.stringify({
                token: token,
                new_password: newPassword,
            }),

        });

        if (response.ok) {

            document.getElementById('successMessage').textContent =
                'Your password has been updated. You can sign in with it now.';

            showModal('successModal');

            // Head to the sign-in page automatically; closing early is fine too.
            const goToLogin = () => { window.location.href = '/login'; };
            setTimeout(goToLogin, 1600);
            document
                .getElementById('successModal')
                .addEventListener('hidden.bs.modal', goToLogin, { once: true });

        } else {

            const error = await response.json();

            document.getElementById('errorMessage').textContent =
                getErrorMessage(error);

            showModal('errorModal');

            if (response.status === 400) {
                document.getElementById('errorMessage').textContent +=
                    ' Please request a new password reset link.';
            }
        }

    } catch (error) {

        document.getElementById('errorMessage').textContent =
            'Unable to connect to the server. Please check your internet connection and try again.';

        showModal('errorModal');

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset password';

    }

});

    </script>
{% endblock scripts %}
